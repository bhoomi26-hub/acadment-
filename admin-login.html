<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff & Counselor Login | Acadment Admissions</title>
    <meta name="description" content="Secure administrative access for Acadment university admissions guidance counselors and staff.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <header class="login-header">
                <a href="/" class="login-logo" title="Acadment Admissions Consultancy">
                    <span class="logo-mark">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                        </svg>
                    </span>
                    <span class="logo-text">Acadment</span>
                </a>
                <div>
                    <span class="login-badge">Counselor Portal</span>
                </div>
                <h1 class="login-title">Staff Administration</h1>
                <p class="login-subtitle">Sign in to manage student enquiries and admission guidance</p>
            </header>

            <div id="loginAlert" class="login-alert error" role="alert" aria-live="polite">
                <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" style="flex-shrink: 0; margin-top: 1px;">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                </svg>
                <span id="loginAlertMsg">Invalid credentials</span>
            </div>

            <form id="adminLoginForm" class="login-form" novalidate>
                <div class="form-group">
                    <label for="usernameInput">Administrative Username</label>
                    <div class="login-input-wrapper">
                        <svg class="login-input-icon" viewBox="0 0 20 20" width="18" height="18" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
                        </svg>
                        <input 
                            type="text" 
                            id="usernameInput" 
                            name="username" 
                            class="login-input" 
                            placeholder="e.g. admin" 
                            autocomplete="username" 
                            required 
                            autofocus
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="passwordInput">Password</label>
                    <div class="login-input-wrapper">
                        <svg class="login-input-icon" viewBox="0 0 20 20" width="18" height="18" fill="currentColor">
                            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
                        </svg>
                        <input 
                            type="password" 
                            id="passwordInput" 
                            name="password" 
                            class="login-input" 
                            placeholder="Enter password" 
                            autocomplete="current-password" 
                            required
                        >
                        <button type="button" id="togglePasswordBtn" class="password-toggle" title="Show or hide password" aria-label="Toggle password visibility">
                            <svg id="eyeIcon" viewBox="0 0 20 20" width="18" height="18" fill="currentColor">
                                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                                <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submitLoginBtn" class="login-btn">
                    <span id="btnText">Sign In to Dashboard</span>
                    <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
                        <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
                    </svg>
                </button>
            </form>

            <div class="login-footer">
                <div class="dev-credentials-pill">
                    <strong>Local Dev Default Credentials:</strong>
                    Username: <code>admin</code> &bull; Password: <code>AcadmentAdmin@2026</code>
                </div>
                <a href="/" class="back-to-site">
                    <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
                        <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/>
                    </svg>
                    <span>Return to Acadment Homepage</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('adminLoginForm');
            const usernameInput = document.getElementById('usernameInput');
            const passwordInput = document.getElementById('passwordInput');
            const togglePasswordBtn = document.getElementById('togglePasswordBtn');
            const submitBtn = document.getElementById('submitLoginBtn');
            const btnText = document.getElementById('btnText');
            const alertBox = document.getElementById('loginAlert');
            const alertMsg = document.getElementById('loginAlertMsg');

            // Password reveal toggle
            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            });

            // Form submission
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertBox.classList.remove('show');

                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                if (!username || !password) {
                    showAlert('Please enter both your administrative username and password.');
                    return;
                }

                // Loading UI
                submitBtn.disabled = true;
                btnText.textContent = 'Authenticating...';

                try {
                    const response = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json().catch(() => ({}));

                    if (response.ok && data.success) {
                        btnText.textContent = 'Redirecting...';
                        // Check for redirect query parameter
                        const urlParams = new URLSearchParams(window.location.search);
                        const nextUrl = urlParams.get('next') || '/admin';
                        window.location.href = nextUrl;
                    } else {
                        showAlert(data.error || 'Authentication failed. Please verify credentials.');
                        submitBtn.disabled = false;
                        btnText.textContent = 'Sign In to Dashboard';
                    }
                } catch (err) {
                    showAlert('Network error connecting to admissions server. Please ensure backend is running.');
                    submitBtn.disabled = false;
                    btnText.textContent = 'Sign In to Dashboard';
                }
            });

            function showAlert(msg) {
                alertMsg.textContent = msg;
                alertBox.classList.add('show');
            }
        });
    </script>
</body>
</html>
